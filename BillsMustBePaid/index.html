  <script>
    window.__rg_showBlockedPage = function (reason) {
      // Keep these URLs in sync with Tools/Sitelock/policy.json _canonical_links.
      var primary = "https://billsmustbepaid.rikegames.com";
      var itch = "https://rikegames.itch.io";
      var steam = "https://store.steampowered.com/app/4421010/Bills_Must_Be_Paid/";
      var safeReason = String(reason || "").replace(/[^a-z0-9_-]/gi, "");
      function btn(href, label) {
        // target=_blank + rel=noopener guarantees the link works inside iframes (itch, etc.)
        // where same-frame navigation to Steam/itch/rikegames may be blocked by X-Frame-Options.
        return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" ' +
          'style="display:block;padding:14px 24px;' +
          'background:transparent;color:#e8c46a;text-decoration:none;' +
          'border:1px solid #c9a961;border-radius:4px;font-size:16px;font-weight:600;' +
          'letter-spacing:0.2px;">' + label + '</a>';
      }
      var html =
        '<div style="position:fixed;inset:0;background:#1a1a1a;color:#fff;' +
        'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;' +
        'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
        'padding:24px;text-align:center;z-index:2147483647;">' +
        '<div style="background:#0d0d0d;border:1px solid rgba(232,196,106,0.35);' +
        'border-radius:6px;padding:32px;max-width:600px;width:100%;' +
        'box-shadow:0 4px 24px rgba(0,0,0,0.5);">' +
        '<h1 style="font-size:28px;margin:0 0 18px 0;font-weight:700;color:#e8c46a;">' +
        "This browser copy can't run here." +
        '</h1>' +
        '<p style="font-size:18px;margin:0 0 28px 0;line-height:1.5;color:#fff;">' +
        "Play the official version of Bills Must Be Paid:" +
        '</p>' +
        '<div style="display:flex;flex-direction:column;gap:10px;">' +
        btn(primary, primary) +
        btn(itch, itch) +
        btn(steam, "Steam") +
        '</div>' +
        '</div>' +
        '<p style="font-size:12px;opacity:0.4;margin:24px 0 0 0;color:#fff;">' +
        "Rike Games &middot; reason: " + safeReason +
        '</p>' +
        '</div>';
      // Force html+body to fill viewport before innerHTML swap.
      // Some portals iframe us at a tiny initial size; without this the
      // sitelock div's position:fixed/inset:0 can render against a stale
      // containing block and end up undersized in a corner until the
      // user resizes the window (or fullscreens).
      document.documentElement.style.cssText =
        "width:100%;height:100%;margin:0;padding:0;background:#1a1a1a;";
      document.body.style.cssText =
        "width:100%;height:100%;margin:0;padding:0;";
      document.body.innerHTML = html;
      // Kick a layout pass shortly after — covers the iframe-resize-after-load race.
      setTimeout(function () {
        try { window.dispatchEvent(new Event('resize')); } catch (e) { }
      }, 100);
      setTimeout(function () {
        try { window.dispatchEvent(new Event('resize')); } catch (e) { }
      }, 600);
      // Auto-redirect to primary canonical after 8s
      setTimeout(function () { window.location.href = primary; }, 8000);
    };
    window.__rikeGate = function (_pass, fail) { fail("lock_missing"); };

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");
    var phraseEl = document.querySelector("#loading-phrase");

    // -----------------------------------------------------------
    // Rotating loading phrases — fade+slide cross-cut under the bar.
    // Fixed deterministic sequence; loops to start if loading takes
    // longer than the full cycle. Stops when Unity finishes loading.
    // -----------------------------------------------------------
    var PHRASE_SEQUENCE = [
      "You have soo many unpaid bills...",
      "filling up your piggy banks...",
      "Btw. we are Roxy & Mike, happy that you play our game",
      "Leave your feedback in the comments or join our Discord",
      "Just one more sec...",
      "ok... now it should really start...",
      "Piggy Banks are getting filthy",
      "We hope you enjoy the game :))"
    ];
    var phraseIdx = 0;  // matches the static text in HTML
    var phraseTimer = null;
    var phraseStopped = false;

    function rotatePhrase() {
      if (phraseStopped) return;
      phraseEl.classList.add("is-out");
      setTimeout(function () {
        if (phraseStopped) return;
        phraseIdx = (phraseIdx + 1) % PHRASE_SEQUENCE.length;
        phraseEl.textContent = PHRASE_SEQUENCE[phraseIdx];
        phraseEl.classList.remove("is-out");
        // Restart the in-animation
        phraseEl.style.animation = "none";
        void phraseEl.offsetWidth;
        phraseEl.style.animation = "";
        phraseTimer = setTimeout(rotatePhrase, 2600);
      }, 320);
    }

    function stopPhrases() {
      phraseStopped = true;
      if (phraseTimer) { clearTimeout(phraseTimer); phraseTimer = null; }
    }

    phraseTimer = setTimeout(rotatePhrase, 2500);

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/a3281b84df56bd219fa7405ac5301400.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/0dbfd54c24ae081a00bffe3dc0bd9e21.data.br",
      frameworkUrl: buildUrl + "/19f08e74d87f21ee171305fdb3dbf851.framework.js.br",
      codeUrl: buildUrl + "/3eb7a21e48eb97d5ea88e1cd66e10dcf.wasm.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Rike Games",
      productName: "Bills Must Be Paid",
      productVersion: "0.2.7.5.2",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
    }


    function bootUnity(jsVerdict) {
      loadingBar.style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          stopPhrases();
          loadingBar.style.display = "none";
          // Forward the JS-side gate verdict to C# RuntimeIntegrity (cross-checks host/referrer).
          try {
            var payload = JSON.stringify({
              t: "ok-" + Date.now(),
              host: jsVerdict && jsVerdict.host || location.hostname,
              ref: jsVerdict && jsVerdict.ref || (document.referrer || "")
            });
            unityInstance.SendMessage("RuntimeIntegrity", "SetJsVerdict", payload);
          } catch (e) { /* C# side will time out and show overlay if not received */ }

          // Iframe-resize race fix: portals (CrazyGames, Poki, etc.) often
          // resize the iframe AFTER our page has loaded. Unity's loader
          // listens for window 'resize' to re-measure the canvas, but if the
          // portal sizes us via iframe attribute changes the inner window
          // doesn't always fire one. ResizeObserver on the container catches
          // every size change regardless of source — we forward it as a
          // synthetic resize so Unity rebuilds its framebuffer correctly.
          try {
            if (typeof ResizeObserver !== 'undefined') {
              var ro = new ResizeObserver(function () {
                try { window.dispatchEvent(new Event('resize')); } catch (e) { }
              });
              ro.observe(container);
            }
            // Belt-and-braces: kick once shortly after boot to defeat the
            // initial-load race even if no further resize ever fires.
            setTimeout(function () {
              try { window.dispatchEvent(new Event('resize')); } catch (e) { }
            }, 150);
            setTimeout(function () {
              try { window.dispatchEvent(new Event('resize')); } catch (e) { }
            }, 600);
          } catch (e) { /* non-fatal */ }
        }).catch((message) => {
          stopPhrases();
          console.error(message);
        });
      };
      document.body.appendChild(script);
    }

    window.__rikeGate(bootUnity, window.__rg_showBlockedPage);
  </script>
