<!DOCTYPE html>
<html lang="en-us">

<head>
  <base href="https://cdn.jsdelivr.net/gh/BreaddeningBread/games@main/HinotoriRhythm/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Holo EN Rhythm Game</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script src="merger.js"></script>
<script>
  const BaseUrl = "https://cdn.jsdelivr.net/gh/BreaddeningBread/games@main/HinotoriRhythm/";
  const TargetDataFile = "Builds.data.unityweb";
  
  loadMergedGameData(BaseUrl + "Build/" + TargetDataFile, 1, 2, (mergedUrl) => {
    const originalOpen = XMLHttpRequest.prototype.open;
    
    XMLHttpRequest.prototype.open = function(method, url) {
      if (typeof url === 'string' && url.indexOf(TargetDataFile) > -1) {
        url = mergedUrl;
      }
      return originalOpen.apply(this, arguments);
    };

    window.unityInstance = UnityLoader.instantiate(
      "unityContainer", 
      BaseUrl + "Build/Builds.json", 
      { onProgress: UnityProgress }
    );
  });
</script>
</head>

<body>
  <div class="webgl-content">
    <div id="unityContainer" style="width: 960px; height: 540px"></div>
    <div class="footer">
      <div class="fullscreen" onclick="unityInstance.SetFullscreen(1)"></div>
      <!--div class="title">fullscreen</div-->
    </div>
  </div>
</body>

</html>
